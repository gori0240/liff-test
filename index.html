<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIFF & API 疎通テスト</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
    #log { background: #f4f4f4; padding: 10px; border-radius: 5px; font-size: 0.9rem; white-space: pre-wrap; word-wrap: break-word; }
    .success { color: green; font-weight: bold; }
    .error { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h2>疎通テスト画面</h2>
  <div id="log">起動中...</div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbyn-PtGsFleWYmvFTufvbQ1ayg456sJ9hYEHB5ohbtCBCXUZALuJkNIaHgub8jk0nLa/exec';
    const LIFF_ID = '2011960473-Iq3sX8wI';
    const logEl = document.getElementById('log');

    function addLog(msg, type = '') {
      logEl.innerHTML += `<div class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
    }

    window.onload = function() {
      logEl.innerHTML = '';
      addLog('1. LIFF初期化を開始します...');

      liff.init({ liffId: LIFF_ID }).then(() => {
        addLog('2. LIFF初期化成功', 'success');
        
        if (liff.isLoggedIn()) {
          const idToken = liff.getIDToken();
          addLog('3. LINEログイン確認済。トークン長: ' + (idToken ? idToken.length : 'なし'));
          testGasApi();
        } else {
          addLog('3. 未ログイン状態です（外部ブラウザ等）。', 'error');
        }
      }).catch((err) => {
        addLog('LIFF初期化エラー: ' + err.message, 'error');
      });
    };

    function testGasApi() {
      addLog('4. GASへのAPI通信(getEvents)を開始します...');
      
      // text/plain でPOST送信
      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'getEvents' })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          addLog('5. GAS通信成功！', 'success');
          addLog('取得した撮影会数: ' + data.data.length);
          addLog('取得データ: ' + JSON.stringify(data.data));
        } else {
          addLog('GAS内部エラー: ' + data.error.message, 'error');
        }
      })
      .catch(err => {
        addLog('通信失敗(CORSエラー等の可能性): ' + err.message, 'error');
      });
    }
  </script>
</body>
</html>
